# Build cache lives on D:.
#
# C: is 100% full (208G of it outside this project), and a debug build of this
# crate is ~4.3G. It filled the disk twice mid-build, which surfaces as a
# confusing "failed to build archive ... (os error 112)" rather than an
# out-of-space error. A release build needs its own tree on top of that and
# would not fit at all.
#
# Nothing in the source tree depends on this. To revert, delete this file —
# cargo goes back to src-tauri/target.
[build]
target-dir = "D:/nexuscore-target"
