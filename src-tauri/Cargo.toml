[package]
name = "nexuscore-desktop"
version = "1.0.0"
description = "NexusCore — Omnichannel Retail & E-commerce ERP"
authors = ["NexusCore"]
edition = "2021"
rust-version = "1.77"

# Tauri 2.x uses both a `lib` and a `bin` target. The `lib` holds the actual
# app entry point (run()); `bin` is a thin shim that calls it.
#
# rlib only, deliberately. This project targets desktop: the `bin` target links
# the rlib, and nothing consumes the other two. Building them cost a 946 MB
# `nexuscore_desktop_lib.lib` archive per debug build and twice filled the disk
# mid-build, which surfaces as a confusing "failed to build archive ... (os
# error 112)" rather than an out-of-space message.
#
# To add iOS / Android later, restore:
#     crate-type = ["staticlib", "cdylib", "rlib"]
# staticlib is required by the iOS target, cdylib by Android. Tauri's mobile
# templates assume all three. Nothing else needs changing here.
[lib]
name = "nexuscore_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-os = "2"
tauri-plugin-window-state = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Owns the ledger write path. tauri-plugin-sql cannot guarantee that BEGIN and
# COMMIT reach the same pooled connection, and a half-written event is silent
# corruption — see docs/LEDGER_SCHEMA.md §4.
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "macros",
] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Smaller release binary by stripping debug symbols and using LTO.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[features]
# This feature is used to enable the custom-protocol on Windows.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
